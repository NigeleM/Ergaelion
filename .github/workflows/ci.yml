# Runs the tests on every push to main and on every pull request.
name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and sync the data
        run: make build
      - name: Python tests
        run: python3 -m unittest discover -s tests
      - name: Go tests
        working-directory: goplaybook
        run: go vet ./... && go test ./...
